version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: incentive_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incentive_db}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - incentive_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incentive_backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - incentive_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incentive_frontend
    depends_on:
      - backend
    env_file:
      - .env
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "3000:3000"
    networks:
      - incentive_network

  nginx:
    image: nginx:alpine
    container_name: incentive_nginx
    depends_on:
      - frontend
      - backend
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - incentive_network

networks:
  incentive_network:
    driver: bridge
